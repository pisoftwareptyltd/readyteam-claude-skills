<title>ReadyTeam Setup Progress</title>

<style>
/* Layout: fixed dark rail on the left (logo, company, phase list), the step list on a flat light ground. Rail becomes a top band on phones. */
:root {
  --ground: #FFFFFF;
  --surface: #F4F4F4;
  --line: #E5E5E5;
  --ink: #151515;
  --muted: #6F6F6F;
  --faint: #B1B1B1;
  --done: #000000;
  --rail: #0D0D0D;
  --rail-ink: #FFFFFF;
  --rail-muted: rgba(255,255,255,.56);
  --rail-line: rgba(255,255,255,.16);
  --coral: #E8604C;
  --coral-tint: #FCEDEA;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #151515; --surface: #232323; --line: rgba(255,255,255,.14); --ink: #F4F4F4; --muted: #B1B1B1;
    --faint: #6F6F6F; --done: #FFFFFF; --coral-tint: rgba(232,96,76,.14); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #151515; --surface: #232323; --line: rgba(255,255,255,.14); --ink: #F4F4F4; --muted: #B1B1B1;
  --faint: #6F6F6F; --done: #FFFFFF; --coral-tint: rgba(232,96,76,.14); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--ground); color: var(--ink); font: 400 14px/1.5 var(--body); }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; }

/* Rail */
.rail { background: var(--rail); color: var(--rail-ink); padding: 28px 24px; display: flex; flex-direction: column; gap: 28px; }
.rail .logo { width: 150px; height: auto; display: block; color: var(--rail-ink); }
.eyebrow { font: 600 11px/1.2 var(--body); letter-spacing: .14em; text-transform: uppercase; }
.rail .eyebrow { color: var(--rail-muted); }
.rail .company { font: 600 15px/1.35 var(--body); margin-top: 6px; }
.phases { display: flex; flex-direction: column; gap: 4px; list-style: none; margin: 0; padding: 0; }
.phases li { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 2px; color: var(--rail-muted); font-weight: 500; }
.phases li.on { background: rgba(255,255,255,.10); color: var(--rail-ink); }
.phases .n { font-variant-numeric: tabular-nums; }
.rail .foot { margin-top: auto; color: var(--rail-muted); font-size: 12px; border-top: 1px solid var(--rail-line); padding-top: 16px; }

/* Main */
.main { padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 28px; display: flex; flex-direction: column; gap: 32px; }

.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px; }
.head .eyebrow { color: var(--muted); }
h1 { font: 700 52px/.94 var(--display); letter-spacing: -.01em; margin: 8px 0 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 10px 0 0; max-width: 52ch; }
.stat { text-align: right; }
.stat .big { font: 700 64px/.9 var(--display); font-variant-numeric: tabular-nums; }
.stat .big span { color: var(--faint); }
.stat .cap { color: var(--muted); font-size: 12px; margin-top: 4px; }

.bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.bar i { height: 6px; background: var(--line); }
.bar i.done { background: var(--done); }
.bar i.skip { background: repeating-linear-gradient(90deg, var(--faint) 0 3px, transparent 3px 6px); }
.bar i.now { background: var(--ink); opacity: .45; }

.sample { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); padding: 3px 8px; border-radius: 2px; color: var(--muted); font-size: 12px; }

section { display: flex; flex-direction: column; gap: 10px; }
section h2 { font: 600 20px/1.2 var(--display); letter-spacing: .01em; margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
section h2 small { font: 500 12px/1 var(--body); color: var(--muted); }

.steps { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 14px 12px; border-bottom: 1px solid var(--line); }
.step .num { font: 700 22px/1 var(--display); color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 2px; }
.step .title { font-weight: 600; }
.step .meta { color: var(--muted); font-size: 13px; margin-top: 2px; min-width: 0; overflow-wrap: anywhere; }
.state { font: 600 10px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; padding: 5px 7px; border-radius: 2px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.step.done .num { color: var(--done); }
.step.done .state { background: var(--done); border-color: var(--done); color: var(--ground); }
.step.skip .title { color: var(--muted); }
.step.skip .state { border-style: dashed; }
.step.next .title { color: var(--ink); }

/* The one coral moment: the step that is waiting on the builder. */
.step.now { background: var(--coral-tint); box-shadow: inset 3px 0 0 var(--coral); }
.step.now .num { color: var(--ink); }
.step.now .state { background: var(--ink); border-color: var(--ink); color: var(--ground); }
.wait { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
.wait b { font-weight: 600; }
.wait .who { color: var(--muted); }

.aop { color: var(--muted); font-size: 13px; border-left: 2px solid var(--line); padding-left: 12px; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .rail { padding: 18px max(16px, env(safe-area-inset-left, 0px)) 16px; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 14px 24px; }
  .rail .logo { width: 128px; }
  .phases { flex-direction: row; flex-wrap: wrap; }
  .rail .foot { display: none; }
  .main { padding-block: 24px 48px; }
  .wrap { padding-inline: 0; gap: 24px; }
  h1 { font-size: 40px; }
  .stat { text-align: left; }
  .stat .big { font-size: 48px; }
  .step { grid-template-columns: 30px minmax(0, 1fr); }
  .step .state { grid-column: 2; justify-self: start; }
}
@media (prefers-reduced-motion: no-preference) {
  .step { transition: background-color 120ms cubic-bezier(.2,0,0,1); }
}
</style>

<script>
(function () {
  var D = { steps: [] };
  try { D = JSON.parse(document.getElementById('setup-data').textContent); } catch (e) { /* keep empty */ }
  var esc = function (t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; };
  var LABEL = { done: 'Done', skipped: 'Skipped', now: 'Now', failed: 'Needs you', todo: 'To do', next: 'Next' };
  var steps = D.steps || [];
  var agent = D.agent || 'Ollie';
  var nowIdx = steps.findIndex(function (s) { return s.state === 'now' || s.state === 'failed'; });
  steps.forEach(function (s, i) { if (s.state === 'todo' && nowIdx >= 0 && i === nowIdx + 1) s._next = true; });
  var done = steps.filter(function (s) { return s.state === 'done'; }).length;
  var skipped = steps.filter(function (s) { return s.state === 'skipped'; }).length;
  var allDone = steps.length && steps.every(function (s) { return s.state === 'done' || s.state === 'skipped'; });

  // A short confetti shower when every step is done (once per viewer; not when motion is reduced).
  function confetti() {
    var seenKey = 'rt-setup-confetti-' + (D.company || '');
    try { if (localStorage.getItem(seenKey)) return; localStorage.setItem(seenKey, '1'); } catch (e) {}
    if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    if (!ctx) return;
    cv.setAttribute('aria-hidden', 'true');
    cv.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50';
    document.body.appendChild(cv);
    var W = cv.width = innerWidth, H = cv.height = innerHeight;
    var cs = getComputedStyle(document.documentElement);
    var cols = [cs.getPropertyValue('--coral').trim() || '#E8604C', '#FF7A00', cs.getPropertyValue('--ink').trim() || '#151515', '#B1B1B1', '#FFC38A'];
    var ps = [];
    for (var i = 0; i < 220; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 3, vr: (Math.random() - 0.5) * 0.3, s: Math.random() * 6, c: cols[i % cols.length] });
    var t0 = performance.now();
    (function step(now) {
      var age = now - t0;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = age > 4500 ? Math.max(0, 1 - (age - 4500) / 1200) : 1;
      ps.forEach(function (p) { p.vy = Math.min(p.vy + 0.12, 5); p.s += 0.05; p.x += p.vx + Math.sin(p.s) * 0.7; p.y += p.vy; p.r += p.vr;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 4, p.w, p.h / 2); ctx.restore(); });
      if (age < 5700) requestAnimationFrame(step); else cv.remove();
    })(t0);
  }

  document.getElementById('company').textContent = D.company || '';
  document.getElementById('eyebrow').textContent = 'Onboarding' + (D.started ? ' · ' + D.started : '');
  if (allDone) { document.getElementById('headline').textContent = 'You\u2019re ready'; confetti(); }
  document.getElementById('foot').textContent = agent + '\u2019s onboarding you, step by step. You\u2019ll be asked only when something is needed from you.';
  document.getElementById('stat').setAttribute('aria-label', done + ' of ' + steps.length + ' steps done');
  document.getElementById('stat').innerHTML = '<div class="big">' + done + '<span>/' + steps.length + '</span></div><div class="cap">steps done' + (skipped ? ' · ' + skipped + ' skipped' : '') + '</div>';

  var phase = function (a, b) { var p = steps.filter(function (s) { return s.n >= a && s.n <= b; }); return { all: p.length, done: p.filter(function (s) { return s.state === 'done' || s.state === 'skipped'; }).length, on: p.some(function (s) { return s.state === 'now' || s.state === 'failed'; }) }; };
  var p1 = phase(1, 6), p2 = phase(7, 12);
  document.getElementById('phases').innerHTML =
    '<li class="' + (p1.on || (!p2.on && !allDone) ? 'on' : '') + '"><span>Your company</span><span class="n">' + p1.done + '/' + p1.all + '</span></li>' +
    '<li class="' + (p2.on ? 'on' : '') + '"><span>Your first project</span><span class="n">' + p2.done + '/' + p2.all + '</span></li>';

  document.getElementById('bar').innerHTML = steps.map(function (s) {
    var c = s.state === 'done' ? 'done' : s.state === 'skipped' ? 'skip' : (s.state === 'now' || s.state === 'failed') ? 'now' : '';
    return '<i class="' + c + '"></i>';
  }).join('');

  var row = function (s) {
    var cls = s.state === 'done' ? 'done' : s.state === 'skipped' ? 'skip' : (s.state === 'now' || s.state === 'failed') ? 'now' : 'next';
    var label = s._next ? LABEL.next : LABEL[s.state] || LABEL.todo;
    var wait = (cls === 'now' && s.waiting) ? '<div class="wait"><b>Waiting on you:</b> ' + esc(s.waiting) + ' <span class="who">' + esc(agent) + '\u2019s holding here.</span></div>' : '';
    return '<li class="step ' + cls + '"' + (cls === 'now' ? ' aria-current="step"' : '') + '><span class="num">' + esc(s.n) + '</span><div><div class="title">' + esc(s.title) +
      '</div><div class="meta">' + esc(s.note) + '</div>' + wait + '</div><span class="state">' + esc(label) + '</span></li>';
  };
  document.getElementById('list1').innerHTML = steps.filter(function (s) { return s.n <= 6; }).map(row).join('');
  document.getElementById('list2').innerHTML = steps.filter(function (s) { return s.n >= 7; }).map(row).join('');
  document.getElementById('aop').innerHTML = 'This page follows your setup. ' + esc(agent) + ' updates it after each step, so you can come back any time and see where you\u2019re up to.' +
    (D.sample ? ' <span class="sample">Sample data</span>' : '');
})();
</script>
